<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Cake Table</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
      margin-top: 20px;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #ccc;
      text-align: left;
    }

    th {
      background: #f4f4f4;
    }

    tbody tr:hover {
      background: #fafafa;
    }

    /* ---------------------- */
    /*    RESPONSIVE TABLE    */
    /* ---------------------- */
    @media (max-width: 700px) {
      table {
        border: 0;
      }

      table thead {
        display: none;
        /* Hide table header */
      }

      table,
      table tbody,
      table tr,
      table td {
        display: block;
        /* width: 100%; */
      }

      table tr {
        background: #fff;
        margin-bottom: 15px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      table td {
        text-align: right;
        padding-left: 50%;
        position: relative;
        border: none;
        border-bottom: 1px dashed #eee;
      }

      table td:last-child {
        border-bottom: 0;
      }

      table td::before {
        content: attr(data-label);
        position: absolute;
        left: 10px;
        top: 10px;
        font-weight: bold;
        color: #555;
        text-align: left;
      }
    }
  </style>

</head>

<body>

  <h2>Cake List</h2>

  <table id="cakeTable">
    <thead>
      <tr>
        <th>No</th>
        <th>Name</th>
        <th>500g</th>
        <th>1 kg</th>
        <th>Tags</th>
        <th>Category</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    fetch("cakes.json")
      .then(res => res.json())
      .then(data => buildTable(data));

    function buildTable(list) {
      const tbody = document.querySelector("#cakeTable tbody");

      list.forEach(item => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
        <td data-label="No">${item.id}</td>
        <td data-label="Name">${item.name}</td>
        <td data-label="500g">${item.price}</td>
        <td data-label="1 Kg">${item.price2}</td>
        <td data-label="Tags">${item.tags.length ? item.tags.join(", ") : "-"}</td>
        <td data-label="Category">${item.category}</td>
      `;

        tbody.appendChild(tr);
      });
    }
  </script>


</body>

</html>
