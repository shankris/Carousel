<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cake Cards</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="about.css">

</head>

<body>

  <nav>
    <div class="container">

      <div class="logo">
        <p>Cake<span>Studio</span></p>
      </div>
      <div class="site-info">
        <p>
          <a href="index.html">Home</a>
          <a href="card.htm">Products</a>
          <a href="about.htm">About</a>
          <a href="contact.htm">Contact</a>
        </p>
      </div>
    </div>
  </nav>


  <div class="hero">

    <div class="container">

      <div class="quote" id="quote">
        Choose a <strong>job</strong> you love, and you will never work a day in your life.
      </div>

    </div>

  </div>

  <section>
    <div class="container">

      <div class="twoCol">
        <div class="left">Left</div>
        <div class="right">Right</div>
      </div>

    </div>
  </section>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    const quoteEl = document.getElementById("quote");
    const text = quoteEl.innerHTML.trim();

    // Split into words manually (no SplitText plugin needed)
    const words = text.split(" ").map(word => {
      return `<span class="word">${word}</span>`;
    });

    quoteEl.innerHTML = words.join(" ");

    gsap.to(".word", {
      opacity: 1,
      y: 0,
      duration: 0.6,
      ease: "power3.out",
      stagger: 0.15
    });

    gsap.to(".quote", {
      opacity: 1,
      duration: 0.1
    });
  </script>


</body>

</html>
